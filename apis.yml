aid: theta-lake
name: Theta Lake
description: >-
  Theta Lake is a cloud- and AI-native Digital Communications Governance and Archiving (DCGA)
  platform for compliance and security across unified communications. It captures, archives,
  supervises, and monitors electronic (eComms), audio (aComms), video (vComms), and AI (aiComms)
  interactions across 100+ certified integrations including Zoom, Microsoft Teams, Webex,
  RingCentral, Slack, Microsoft Copilot, and Anthropic. The Theta Lake API (v1) exposes data
  ingestion, records, unified search, supervision spaces, legal hold and legal matters, retention
  libraries, workflows, identities, exports, and audit logs, secured with OAuth2 client-credentials
  and JWT bearer tokens carrying fine-grained permission scopes.
