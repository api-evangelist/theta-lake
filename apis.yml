    The Theta Lake API (v1) provides programmatic access to the DCGA platform: ingest AI, audio,
    chat, document, email, and video content; manage records, comments, labels, and dispositions;
    run unified search and exports; administer supervision spaces, identities, directory groups,
    users, roles, and workspaces; drive workflows and analysis policies; and operate legal hold,
    legal matters, cases, retention libraries, storage accounts, and audit logs.
