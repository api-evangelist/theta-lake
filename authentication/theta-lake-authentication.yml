  oauth2_flows:
  - clientCredentials
  model: >-
    Create an API key (client_id + client_secret) in the Theta Lake developer portal, exchange it
    at POST /token via the OAuth2 client-credentials grant (RFC 6749) for a short-lived JWT bearer
    access token (expires_in 3600s), then send it as `Authorization: Bearer <jwt>` on every call.
    Tokens are scoped to a workspace and a data center and carry a permissions[] set enforced
    per-operation (see scopes/theta-lake-scopes.yml). GET /token/context returns a token's
    workspace, data_center, type (jwt|oauth|third_party), and granted permissions.
