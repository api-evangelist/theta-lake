        $ref: '#/schemas/hash_sha256'
      uuid:
        $ref: '#/schemas/uuid'
      upload_date:
        $ref: '#/schemas/upload_date'
  GetIntegrationStateResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      state:
        type: object
        properties:
          created_at:
            $ref: '../common/schemas.yml#/schemas/created_at'
          internal:
            $ref: '#/schemas/internal'
          last_run:
            $ref: '#/schemas/last_run'
          last_upload:
            $ref: '#/schemas/last_upload'
