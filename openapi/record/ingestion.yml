  participant_id:
    type: string
    description: The unique identifier from the original platform where the content was generated
    example: abc123

  name:
    type: string
    description: The participant's name as a single string
    example: John Doe

  first_name:
    type: string
    description: The participant's first name
    example: John

  last_name:
    type: string
    description: The participant's last name
    example: Doe

  email:
    type: string
    description: The participant's email address
    example: john.doe@email.com

  phone_number:
    type: string
    description: The participant's phone number. This phone number can only be digits with an optional '+' prefix
    example: '+5551234567'

  extension:
    type: string
    description: The participant's extension
    example: x3071

  location:
    type: string
    description: The participant's location
    example: France

  device_id:
    type: string
    description: The participant's device ID
    example: 3e:24:21:df:02

  employee_id:
    type: string
    description: The participant's employee ID
    example: '2232'

  is_external:
    type: boolean
    description: Indicates if the participant is external to the customer's organization
    default: false
    example: true

  owner_info:
    type: object
    properties:
      id:
        type: string
        description: The unique identifier from the original platform where the content was generated
        example: abc123
      name:
        type: string
        description: The owner's name as a single string
        example: John Doe
      first_name:
        type: string
        description: The owner's first name
        example: John
      last_name:
        type: string
        description: The owner's last name
        example: Doe
      email:
        type: string
        description: The owner's email address
        example: john.doe@email.com
      phone_number:
        type: string
        description: The owner's phone number. This phone number can only be digits with an optional '+' prefix
        example: '+5551234567'
      extension:
        type: string
        description: The owner's extension
        example: x3071
      location:
        type: string
        description: The owner's location
        example: France
      device_id:
        type: string
        description: The owner's device ID
        example: 3e:24:21:df:02
      employee_id:
        type: string
        description: The owner's employee ID
        example: '2232'
      is_external:
        type: boolean
        description: Indicates if the participant is external to the customer's organization
        default: false
        example: true

  response_content_type:
    type: string
    description: The uploaded data's detected [content type](https://www.iana.org/assignments/media-types/media-types.xhtml)
    example: video/mp4
  hash_sha256:
    type: string
    description: The uploaded data's SHA256 hash
    example: 5179a08ff65e6388a466447dd1c6ee5fae0c9b080ec3a61e21cd6818ed1d8624
  uuid:
    type: string
    description: The uploaded data's UUID in the Theta Lake system
    example: 5883caa5-c428-5998-dcda-b51a457c021f
  upload_date:
    type: string
    format: date-time
    description: The uploaded data's timestamp in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: '2023-06-07T13:08:43Z'
  message_id:
    type: string
    description: The message ID from the chat platform
    example: 7302e64f-2712-4e57-9dec-ada177b2d33b
  message_participant_id:
    type: string
    description: The ID of the participant that sent this message. This ID can be for either an activemember or passivemember.
    example: user1234
  activemember_participant_id:
    type: string
    description: The ID of the participant that sent this message. This ID must correspond to an ID in the `meta.participants.activemember` array.
    example: user1234
  message_text:
    type: string
    description: The message's text
    example: Do you want go to lunch?
  message_content_type:
    type: string
    enum: ['text/plain', 'application/html', 'text/markdown']
    description: The message's content type
    example: 'text/plain'
  message_timestamp:
    type: string
    format: date-time
    description: The message's timestamp in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: '2023-06-07T13:08:43Z'

  platform_attributes:
    type: object
    description: An open set of key-value pairs that can be used to store platform attributes. API platform attributes are only searchable by exact string match.
    additionalProperties:
      type: string
      description: Key-value pairs
    example:
      call_id: '2909b385-f84c-4935-bef0-87e6c6a3939b'
      channel_id: '4'
      duration: '1h02m29s'

  deleted_timestamp:
    type: string
    format: date-time
    description: The message's deleted timestamp in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: '2023-06-08T13:08:43Z'
  edited_message_id:
    description: The id of the message being edited
    type: string
    example: '12345921'
  reaction_to_message_id:
    description: The id of the message being reacted to
    type: string
    example: '12345921'
  reply_to_message_id:
    description: The id of the message being replied to
    type: string
    example: '12345921'
  attachment_ids:
    type: array
    description: The IDs of the attachments attached to this specific message
    items:
      type: string
    example: ['example-attachment-id']

  attachment_id:
    type: string
    description: A unique ID for the attachment. Used to reference attachments in the chat messages.
    example: example-attachment-id
  attachment_name:
    type: string
    description: The file name of the attachment. **Must match the file name of the actual attachment**
    example: shared_image.png
  attachment_size:
    type: integer
    description: The size in bytes of the attachment
    example: 355435
  attachment_content_type:
    type: string
    description: The content-type of the attachment. Uses standard [MIME types](https://www.iana.org/assignments/media-types/media-types.xhtml)
    example: image/png
  attachment_create_time:
    type: string
    format: date-time
    description: The creation timestamp of the attachment in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: '2023-06-08T13:08:43Z'