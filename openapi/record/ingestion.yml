  PostDatumResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode201'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString201'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
