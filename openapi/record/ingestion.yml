paths:
  ingestion/integration/{id}/ai_interactions:
    post:
      tags:
        - Data Ingestion
      summary: Upload AI interactions
      description: |
        **REQUIRED PERMISSION:** `ingestion:upload`  
        **RATE LIMIT:** `heavy`  
        **NOTE:** Constants have been assigned for well known AI participants.  
        Use the following `name` and `id` values in the `participants` array when uploading AI interactions:  
        | Name                 | ID                                   |  
        |----------------------|--------------------------------------|  
        | Anthropic Claude     | e31a9f3d-62d8-3b60-5d52-9366a8852932 |  
        | Google Gemini        | 019b1356-a860-7fba-940f-924d6b1f28c4 |  
        | Microsoft Copilot    | 019b1356-a860-770a-b95b-0b19660f6b48 |  
        | OpenAI ChatGPT       | 019b1356-a860-7eab-8920-097001ea2f1a |  
        | X.ai Grok            | 019b1356-a860-74a8-bdcc-3af06f5d0bdb |
        | Zoom AI Companion    | acc7f28a-f3e1-0366-9192-fd5008404c16 |  
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the integration to which the AI interaction should be uploaded
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/schemas/PostAiInteractionBody'
      responses:
        '201':
          description: The response when the AI interaction has been uploaded
          content:
            application/json:
              schema:
                $ref: '#/schemas/PostDatumResponse'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '409':
          $ref: '#/schemas/ConflictedResponse'
        '415':
          $ref: '../common/errors.yml#/responses/UnsupportedMediaType'
        '423':
          $ref: '../common/errors.yml#/responses/Locked'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

