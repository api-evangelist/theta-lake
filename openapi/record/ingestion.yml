            $ref: '#/schemas/paused'
          status:
            $ref: '#/schemas/status'

  PutIntegrationStateRequest:
    type: object
    properties:
      internal:
        $ref: '#/schemas/internal'
      last_run:
        $ref: '#/schemas/last_run'
      status:
        $ref: '#/schemas/status'

  PostChatResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      result:
        type: object
        properties:
          chat:
            $ref: '#/schemas/post_datum_result'
          file_attachments:
            type: object
            description: A map of the attachment upload responses. The keys are the attachment filenames.
            additionalProperties:
              $ref: '#/schemas/post_datum_result'
            example:
              chat_pdf:
                content_type: application/pdf
                hash_sha256: ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
                uuid: 856c2aee-d5ac-4e95-9f88-9a63b1b3e10a
                upload_date: '2023-06-07T13:08:43Z'

  internal:
    type: object
    description: Free form JSON object that can be used to track any internal integration state
    nullable: true
    example: { 'A': 1, 'B': 2, 'C': 3 }

  status:
    type: string
    enum: [OK, FAILED, BADAUTH, SKIPPED, QUOTA_EXCEED]
    description: The integration's status
    example: OK

  last_run:
    type: string
    format: date-time
    description: The timestamp of the last run of the integration in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6), must be set by the integration
    example: '2023-06-07T13:08:43Z'

  last_upload:
    type: string
    format: date-time
    description: The timestamp of the last upload to the integration in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6). Automatically set by the API.
    example: '2023-06-07T13:08:43Z'

  paused:
    type: boolean
    description: Indicates if the integration is paused
    example: false

  audio_type:
    type: string
    enum: [callrecording, conferencecall, voicemail]
    description: The type of audio
    example: conferencecall

  publishing_type:
    type: string
    enum: [pre, post]
    default: post
    description: Indicates whether or not the content has been published and therefore is in a pre-publishing or post-publishing workflow
    example: post

  video_type:
    type: string
    enum: [videoconference, marketingasset, webinar]
    description: The type of video
    example: videoconference

  call_direction:
    type: string
    enum: [outbound, inbound]
    description: The direction of the call
    example: outbound

  call_scope:
    type: string
    enum: [internalonly, includesexternal]
    description: The scope of the call
    example: includesexternal

  content_type:
    type: string
    description: The content-type of the data. Uses standard [MIME types](https://www.iana.org/assignments/media-types/media-types.xhtml)
    example: video/mp4

  create_date:
    type: string
    format: date-time
    description: The data creation timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: '2023-06-07T13:08:43Z'

  custom_transport_type:
    type: string
    description: A custom MIME style string which identifies the platform from which the content was generated
    example: video/zoom

  document_type:
    type: string
    enum: [chattranscript, fax, provided-transcript, videoscript]
    description: The type of document
    example: chattranscript

  transport_type:
    type: string
    description: A MIME style string which identifies the platform from which the content was generated
    example: video/zoom

  identity_data:
    type: string
    description: A unique, arbitrary string identifier that is specified by the client. You can use this identifier to verify whether the data has been uploaded.
    example: something-unique

  datum_participants:
    type: object
    description: >
      A map of role names to arrays of participant objects, where the keys in the map can be any of the following 
      participant role names: **host, attendee, caller, callee, or collaborator**.
    additionalProperties:
      $ref: '#/schemas/participant_infos'
    example:
      host: [
          {
            id: abc123,
            name: John Doe,
            first_name: John,
            last_name: Doe,
            email: john.doe@email.com,
            phone_number: '5555555555',
            extension: x3071,
            location: California,
            device_id: John's cell,
            # is_external: false,
          },
        ]
      attendee:
        [
          {
            id: xyz456,
            name: Jane Doe,
            first_name: Jane,
            last_name: Doe,
            email: jane.doe@email.com,
            phone_number: '5555556666',
            extension: x3081,
            location: Texas,
            device_id: Jane's home,
            is_external: false,
          },
          {
            id: lmn789,
            name: George Smith,
            first_name: George,
            last_name: Smith,
            email: george.smith@email.com,
            phone_number: '5555557777',
            extension: x3234,
            location: New York,
            device_id: George's office,
            is_external: true,
          },
        ]

  ai_interaction_participants:
    type: object
    description: >
      A map of role names to arrays of participant objects, where the keys in the map can be any of the following 
      participant role names: **activemember**.
    additionalProperties:
      type: array
      items:
        type: object
        properties:
          id:
            $ref: '#/schemas/participant_id'
          name:
            $ref: '#/schemas/name'
          first_name:
            $ref: '#/schemas/first_name'
          last_name:
            $ref: '#/schemas/last_name'
          email:
            $ref: '#/schemas/email'
          phone_number:
            $ref: '#/schemas/phone_number'
    example:
      activemember: [
          {
            id: user-123,
            name: 'Jim Halpert',
            email: 'jim.halpert@dundermifflin.com'
          },
          {
            id: ai-456,
            name: Computron
          }
        ]

  audio_participants:
    type: object
    description: >
      A map of role names to arrays of participant objects, where the keys in the map can be any of the following 
      participant role names: **caller, callee, host, or attendee**.
    additionalProperties:
      $ref: '#/schemas/participant_infos'
    example:
      caller:
        [
          {
            id: user1,
            name: Jim Halpert,
