  ingestion/exists:
    get:
      tags:
        - Data Ingestion
      summary: Check data already exists
      description: |
        **REQUIRED PERMISSION:** `ingestion:read`  
        **RATE LIMIT:** `light`  
        **NOTE:** This endpoint supports searching for multiple datums. Because of this behavior it will never return a 404 Not Found, but instead just a blank response array.  
        Depending on the datum type (audio, chat, document, email, other, or video) different fields are returned. Fields that are always returned are denoted with a '*'.  
        Only 1 identifier can be specified, if both are specified, only `identity_data` will be checked

      parameters:
        - name: identity_data
          in: query
          description: 'The arbitrary string identifier data associated with the record. NOTE: Limit of 20 per request'
          schema:
            type: array
            items:
              type: string
        - name: hash_sha256
          in: query
          description: 'The sha256 hash of the record to check. NOTE: Limit of 20 per request'
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: The datums matching the given `identity_data` in the request
          content:
            application/json:
              schema:
                $ref: '#/schemas/GetDatumIdentityResponse'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

  ingestion/quota:
    get:
      tags:
        - Data Ingestion
      summary: Get upload quota
      description: |
        **REQUIRED PERMISSION:** `ingestion:read`  
        **RATE LIMIT:** `heavy`  
        **NOTE:** The quota is for the entire org unit

      parameters:
        - name: from
          in: query
          required: false
          description: A date in YYYY-MM-DD format that is the start of the time range to summarize in, if not provided the summary starts at the beginning of time
          schema:
            type: string
            example: '2023-01-01'
        - name: to
          in: query
          required: false
          description: A date in YYY_MM_DD format that is the end of the time range to summarize, if not provided the summary ends with the current day
          schema:
            type: string
            example: '2023-01-31'
      responses:
        '200':
          description: The upload quota
          content:
            application/json:
              schema:
                $ref: '#/schemas/QuotaResponse'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

schemas:
  ConflictedResponse:
    description: The data has already been uploaded
    content:
      application/json:
        schema:
          type: object
          properties:
            status_code:
              $ref: '../common/schemas.yml#/schemas/StatusCode200'
            status_string:
              $ref: '../common/schemas.yml#/schemas/StatusString200'
            request_id:
              $ref: '../common/schemas.yml#/schemas/RequestId'
            message:
              type: string
              description: A message stating the data file has already been uploaded
            result:
              type: object
              properties:
                content_type:
                  $ref: '#/schemas/response_content_type'
                hash_sha256:
                  $ref: '#/schemas/hash_sha256'
                uuid:
                  $ref: '#/schemas/uuid'

  QuotaResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      quota:
        type: object
        properties:
          data:
            type: object
            properties:
              api_attachment_bytes_used:
                type: integer
                description: The used quota in bytes for API attachment data
                example: 0
              api_bytes:
                type: integer
                description: The quota in bytes for API data
                example: 1000000000
              api_bytes_daily:
                type: integer
                description: The daily used quota in bytes for API data
                example: 1000000000
              api_bytes_used:
                type: integer
                description: The used quota in bytes for API data
                example: 2136220124
              audio_attachment_bytes_used:
                type: integer
                description: The used quota in bytes for audio attachment data
                example: 397
              audio_bytes:
                type: integer
                description: The quota in bytes for audio data
                example: 1000000000
              audio_bytes_used:
                type: integer
                description: The used quota in bytes for audio data
                example: 424210501
              document_attachment_bytes_used:
                type: integer
                description: The used quota in bytes for document attachment data
                example: 8317757
              document_bytes:
                type: integer
                description: The quota in bytes for document data
                example: 1000000000
              document_bytes_used:
                type: integer
                description: The used quota in bytes for document data
                example: 24145186
              email_attachment_bytes_used:
                type: integer
                description: The used quota in bytes for email attachment data
                example: 0
              email_bytes:
                type: integer
                description: The quota in bytes for email data
                example: 1000000000
              email_bytes_used:
                type: integer
                description: The used quota in bytes for email data
                example: 28652866
              other_attachment_bytes_used:
                type: integer
                description: The used quota in bytes for all other attachment data
                example: 0
              other_bytes:
                type: integer
                description: The quota in bytes for all other types of data
                example: 1000000000
              other_bytes_used:
                type: integer
                description: The used quota in bytes for all other types of data
                example: 653135
              total_bytes:
                type: integer
                description: The quota in bytes for all data
                example: 1000000000
              total_bytes_daily:
                type: integer
                description: The daily used quota in bytes for all data
                example: 1000000000
              total_bytes_used:
                type: integer
                description: The used quota in bytes for all data
                example: 6220124
              video_attachment_bytes_used:
                type: integer
                description: The used quota in bytes for video attachment data
                example: 25181
              video_bytes:
                type: integer
                description: The quota in bytes for video data
                example: 1000000000
              video_bytes_used:
                type: integer
                description: The used quota in bytes for video data
                example: 81802101
          message:
            type: string
            description: A message with the date range for the quota summary
            example: Quota usage summary for date range 2023-01-01 to 2023-01-31

  GetDatumIdentityResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      datums:
        type: array
        description: An array of datums matching the identity_data's from the query string, will be empty if no results found
        items:
          type: object
          required:
            [
              content_type,
              create_date,
              data_length,
              hash_sha256,
              transport_type,
              upload_date,
              identity_data,
              uuid,
              publishing_type,
            ]
          properties:
            audio_type:
              $ref: '#/schemas/audio_type'
            call_direction:
              $ref: '#/schemas/call_direction'
            call_scope:
              $ref: '#/schemas/call_scope'
            content_type:
              $ref: '#/schemas/content_type'
            create_date:
              $ref: '#/schemas/create_date'
            custom_transport_type:
              $ref: '#/schemas/custom_transport_type'
            data_length:
              type: integer
              description: The datum length in bytes
              example: 770537
            # document_type:
            #   $ref: '#/schemas/document_type'
            hash_sha256:
              type: string
              description: A SHA256 hash of the datum content
              example: 3489beffbc55532f4019f49b1a279592f4fdcd5d7dd9c7802ab789405a4e0359
            identity_data:
              $ref: '#/schemas/identity_data'
            original_uri:
              type: string
              description: If the upload was a URL (via the text/x-uri Content-Type), this field will hold the original URI used to download the content
              example: https://youtu.be/dQw4w9WgXcQ
            publishing_type:
              $ref: '#/schemas/publishing_type'
            transport_type:
              type: string
              description: MIME formated string which identifies the platform from which the datum was generated
              example: video/zoomarchive
            upload_date:
              type: string
              format: date-time
              description: The datum upload timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
              example: '2023-06-07T13:13:50.925Z'
            uuid:
              type: string
              description: Generated by the ingestion service to uniquely identify the datum
              example: a50e8729-0453-5908-02a7-50f6e0e9c654
            video_type:
              $ref: '#/schemas/video_type'

  PostDatumBody:
    type: object
    properties:
      meta:
        type: object
        required: [file_name, identity_data, create_date]
        properties:
          create_date:
            $ref: '#/schemas/create_date'
          custom_transport_type:
            $ref: '#/schemas/custom_transport_type'
          file_name:
            type: string
            description: The filename for the data
            example: my-data-upload.zip
          identity_data:
            $ref: '#/schemas/identity_data'
          platform_attributes:
            $ref: '#/schemas/platform_attributes'
          owner:
            $ref: '#/schemas/owner_info'
          participants:
            $ref: '#/schemas/datum_participants'
      data:
        type: string
        format: binary
        description: The file to upload

  PostAiInteractionBody:
    type: object
    properties:
      meta:
        type: object
        required: [file_name, identity_data, create_date]
        properties:
          create_date:
            $ref: '#/schemas/create_date'
          custom_transport_type:
            $ref: '#/schemas/custom_transport_type'
          file_name:
            type: string
            description: This is the **title** of the AI interaction record.
            example: Conversation with ChatGPT on June 1st
          identity_data:
            $ref: '#/schemas/identity_data'
          platform_attributes:
            $ref: '#/schemas/platform_attributes'
          participants:
            $ref: '#/schemas/ai_interaction_participants'
      ai_interaction:
        type: object
        required: [application, conversation, participants, messages, attachments]
        additionalProperties: false
        properties:
          application:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
                description: The name of the application hosting the AI interaction
                example: 'ChatGPT'
          model:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
                description: The name of the AI model used in the interaction
                example: 'GPT-4'
              provider:
                type: string
                description: The provider of the AI model
                example: 'OpenAI'
              version:
                type: string
                description: The version of the AI model
                example: '2024-03-15'
              temperature:
                type: string
                description: The temperature setting used for the AI model
                example: '0.7'
              max_tokens:
                type: string
                description: The maximum number of tokens used in the AI model
                example: '2048'
          conversation:
            type: object
            additionalProperties: false
            required: [id, name, begin_time, end_time]
            properties:
              id:
                type: string
                description: The AI interaction conversation ID
                example: 'claude_chat_01SRJsrWaqczVoPgPNBps7yW'
              name:
                type: string
                description: The AI interaction conversation name
                example: 'Chat with Claude on June 1st'
              begin_time:
                type: string
                format: date-time
                description: The AI interaction conversation start time in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
                example: '2024-06-01T14:30:00Z'
              end_time:
                type: string
                format: date-time
                description: The AI interaction conversation end time in [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
                example: '2024-06-01T15:00:00Z'
              previous_uuid:
                type: string
                description: The UUID of the previous AI interaction in the conversation. Required if connecting multiple AI interactions in a conversation.
                example: 'a50e8729-0453-5908-02a7-50f6e0e9c654'

          messages:
            type: array
            items:
              type: object
              required: [id, participant_id, text, content_type, timestamp]
              properties:
                id:
                  $ref: '#/schemas/message_id'
                participant_id:
                  $ref: '#/schemas/activemember_participant_id'
                text:
                  $ref: '#/schemas/message_text'
                content_type:
                  $ref: '#/schemas/message_content_type'
                timestamp:
                  $ref: '#/schemas/message_timestamp'
                message_type: 
                  type: string
                  description: The type of message in the AI interaction
                  enum: ['message', 'prompt', 'systemprompt', 'disclaimer']
                  example: 'message'
                tokens_used:
                  type: string
                  description: The number of tokens used by the AI interaction message
                  example: '150'
                confidence_score:
                  type: string
                  description: The confidence score of the AI interaction message
                  example: '0.95'
                stop_reason:
                  type: string
                  description: The reason the AI interaction message was stopped
                  example: 'max_tokens'
                explanation:
                  type: string
                  description: Explanation for the AI interaction message
                  example: 'The model reached the maximum token limit.'
                reasoning:
                  type: string
                  description: The reasoning behind the AI interaction message
                  example: 'The model inferred the user wanted a summary.'
                latency:
                  type: string
                  description: The latency of the AI interaction message in milliseconds
                  example: '250'
                deleted_timestamp:
                  $ref: '#/schemas/deleted_timestamp'
                edited_message_id:
                  $ref: '#/schemas/edited_message_id'
                reaction_to_message_id:
                  $ref: '#/schemas/reaction_to_message_id'
                reply_to_message_id:
                  $ref: '#/schemas/reply_to_message_id'
                attachment_ids:
                  $ref: '#/schemas/attachment_ids'
            example:
              - id: msg-001
                participant_id: user-123
                text: "What is the capital of France?"
                content_type: "text/plain"
                timestamp: "2024-06-01T14:31:00Z"
              - id: msg-002
                participant_id: ai-456
                text: "The capital of France is Paris."
                reply_to_message_id: "msg-001"
                content_type: "text/plain"
                timestamp: "2024-06-01T14:31:05Z"
          attachments:
            type: array
            description: An array of meta data for all the attachments. If there are no attachments, this should just be an empty array.
            items:
              type: object
              required: [id, name, content_type]
              properties:
                id:
                  $ref: '#/schemas/attachment_id'
                name:
                  $ref: '#/schemas/attachment_name'
                size:
                  $ref: '#/schemas/attachment_size'
                content_type:
                  $ref: '#/schemas/attachment_content_type'
                create_time:
                  $ref: '#/schemas/attachment_create_time'
      attachments:
        type: array
        description: The actual attachment files from the AI interaction messages
        items:
          type: string
          format: binary

