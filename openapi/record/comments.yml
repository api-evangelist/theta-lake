paths:
  records/{id}/comments:
    get:
      tags:
        - Records
      summary: Get comments on a record
      description: |
        **REQUIRED PERMISSION:** `comments:read`  
        **RATE LIMIT:** `medium`
      parameters:
        - name: id
          in: path
          required: true
          description: The ID or UUID of the record to get a shareable link for
          schema:
            type: string
          examples:
            example1:
              value: '1307830'
            example2:
              value: ca116f96-bbd5-11ef-9468-53af98260bba

      responses:
        '200':
          description: Returns a list of comments
          content:
            application/json:
              schema:
                $ref: '#/schemas/GetCommentsResponse'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

    post:
      tags:
        - Records
      summary: Create a comment on a record
      description: |
        **REQUIRED PERMISSION:** `comments:create`  
        **RATE LIMIT:** `medium`  
        **NOTE:** When using `parent_id` to post a reply, the parent must be a top-level comment. You cannot reply to a comment that is already a reply; nested replies are not supported and will result in `400 Bad Request`.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID or UUID of the record to create a comment for
          schema:
            type: string
          examples:
            example1:
              value: '1307830'
            example2:
              value: ca116f96-bbd5-11ef-9468-53af98260bba
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: '#/schemas/CreateCommentResponse'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

  records/{id}/comments/{comment_id}:
    put:
      tags:
        - Records
      summary: Update a comment on a record
      description: |
        **REQUIRED PERMISSION:** `comments:update`  
        **RATE LIMIT:** `medium`
      parameters:
        - name: id
          in: path
          required: true
          description: The ID or UUID of the record the comment is associated with
          schema:
            type: string
          examples:
            example1:
              value: '1307830'
            example2:
              value: ca116f96-bbd5-11ef-9468-53af98260bba
        - name: comment_id
          in: path
          required: true
          description: The ID of the comment to update
          schema:
            type: integer
          example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Comment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/schemas/UpdateCommentResponse'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

    delete: 
      tags:
        - Records
      summary: Delete a comment on a record
      description: |
        **REQUIRED PERMISSION:** `comments:delete`  
        **RATE LIMIT:** `medium`  
        **NOTE:** Deleting a comment will also delete all of its replies if it is a top-level comment. If the comment being deleted is a reply, only that reply will be deleted.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID or UUID of the record the comment is associated with
          schema:
            type: string
          examples:
            example1:
              value: '1307830'
            example2:
              value: ca116f96-bbd5-11ef-9468-53af98260bba
        - name: comment_id
          in: path
          required: true
          description: The ID of the comment to delete
          schema:
            type: integer
          example: 12345
      responses:
        '200':
          description: Comment deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/schemas/DeleteCommentResponse'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

# Schemas for comments endpoints
schemas:
  CreateCommentRequest:
    type: object
    required:
      - comment
    properties:
      comment:
        type: string
        description: The text content of the comment
        example: User comment text
      parent_id:
        type: integer
        nullable: true
        description: The ID of the top-level parent comment when posting a reply. Must not be an ID of a comment that is already a reply.
        example: 12344

  CreateCommentResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode201'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString201'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      comment:
        $ref: '#/schemas/commentReply'

  UpdateCommentRequest:
    type: object
    required:
      - comment
    properties:
      comment:
        type: string
        description: The updated text content of the comment
        example: Updated user comment text

  UpdateCommentResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      comment:
        $ref: '#/schemas/comment'

  DeleteCommentResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      status:
        type: string
        description: Confirmation message after the comment was deleted
        example: Comment deleted successfully

  GetCommentsResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      comments:
        type: array
        description: An array of parent comments with nested replies (empty array if there are no comments)
        items:
          $ref: '#/schemas/comment'

  comment:
    allOf:
      - $ref: '#/schemas/commentReply'
      - type: object
        properties:
          replies:
            type: array
            description: An array of replies
            items:
              $ref: '#/schemas/commentReply'

  commentReply:
    type: object
    properties:
      created_at:
        $ref: '../common/schemas.yml#/schemas/created_at'
      flag:
        type: string
        description: The name of the flag
        example: confirmed_risk
        nullable: true
        enum:
          - cleared
          - confirmed_risk
          - escalate
          - false_detection
          - missed_detection
          - noteworthy # TODO: check this against what is in comments.go
      id:
        type: integer
        description: The ID of the comment
        example: 12345
      parent_id:
        type: integer
        nullable: true
        description: The ID of the parent comment, if this comment is a reply
        example: 12344
      record_id:
        type: integer
        description: The record ID the comment is associated with
        example: 501263
      text:
        type: string
        description: The text content of the comment
        example: User comment text
      updated_at:
        $ref: '../common/schemas.yml#/schemas/updated_at'
      user_id:
        type: integer
        nullable: true
        description: The ID of the user who created the comment. Will be null if the comment is a system comment
