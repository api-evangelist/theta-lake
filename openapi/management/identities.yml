  PutMergeIdentitiesResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      merged_identity:
        $ref: '#/schemas/Identity'

  PutMergeIdentitiesAsyncResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode202'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString202'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      data:
        $ref: '#/schemas/RequestStatus'

  GetMergeStatusAsyncResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      data:
        $ref: '#/schemas/RequestStatusWithResult'

  MergeRequestBody:
    type: object
    properties:
      identity_ids:
        type: array
        description: An array of identity IDs to merge to the target identity
        items:
          type: integer
        example:
          - 21
          - 22
          - 23
          - 24
          - 25
      target_identity_id:
        type: integer
        description: The target identity ID to merge the identities into
        example: 20
      reset_and_reenter_reason:
        type: string
        description: '**The reason for resetting and reentering the identities. If not provided, the records will not be reset and reentered**'
        example: 'Change of department - reprocessing needed for compliance'
        nullable: true

  RequestStatus:
    type: object
    properties:
      async_request_id:
        type: string
        description: The request ID of the initial asynchronous merge request
      request_parameters:
        $ref: '#/schemas/MergeRequestBody'
      status:
        type: string
        description: The status of the asynchronous merge request
        example: completed
        enum:
          - accepted
          - queued
          - in_progress
          - completed
          - failed

  RequestStatusWithResult:
    type: object
    allOf:
      - $ref: '#/schemas/RequestStatus'
    properties:
      result:
        type: object
        nullable: true
        allOf:
          - $ref: '#/schemas/Identity'
        description: The merged identity from the async request

  Identity:
    type: object
    properties:
      ai_participant:
        $ref: '#/schemas/ai_participant'
      created_at:
        $ref: '../common/schemas.yml#/schemas/created_at'
      email:
        $ref: '#/schemas/email'
      email_end_date:
        $ref: '#/schemas/email_end_date'
      email_start_date:
        $ref: '#/schemas/email_start_date'
      external_id:
        $ref: '#/schemas/external_id'
      external_id_end_date:
        $ref: '#/schemas/external_id_end_date'
      external_id_start_date:
        $ref: '#/schemas/external_id_start_date'
      extra_attributes:
        $ref: '#/schemas/IdentityExtraAttributes' # An Identities extra_attributes have created_at and updated_at
      globally_risky:
        type: boolean
        description: Indicates if the identity was marked risky from identity index
        example: false
      id:
        $ref: '#/schemas/id'
      is_submitter:
        $ref: '#/schemas/is_submitter'
      managed:
        $ref: '#/schemas/managed'
      name:
        $ref: '#/schemas/name'
      participant:
        $ref: '#/schemas/participant'
      phone_number:
        $ref: '#/schemas/phone_number'
      phone_number_end_date:
        $ref: '#/schemas/phone_number_end_date'
      phone_number_start_date:
        $ref: '#/schemas/phone_number_start_date'
      risky:
        $ref: '#/schemas/risky'
      source:
        $ref: '#/schemas/source'
      updated_at:
        $ref: '../common/schemas.yml#/schemas/updated_at'

  ExtraAttributes:
    type: array
    description: Extra attributes are free form attributes that can be used to store any extra meta data about this identity
    items:
      type: object
      properties:
        end_date:
          $ref: '#/schemas/end_date'
        field:
          $ref: '#/schemas/field'
        id:
          type: integer
          description: Extra attribute field identifier
          example: 1052392
        start_date:
          $ref: '#/schemas/start_date'
        value:
          $ref: '#/schemas/value'

  IdentityExtraAttributes:
    type: array
    description: Extra attributes are free form attributes that can be used to store any extra meta data about this identity
    items:
      type: object
      properties:
        created_at:
          nullable: true
          allOf:
            - $ref: '../common/schemas.yml#/schemas/created_at'
        end_date:
          $ref: '#/schemas/end_date'
        field:
          $ref: '#/schemas/field'
        id:
          type: integer
          description: Extra attribute field identifier
          example: 1052392
        source:
          $ref: '#/schemas/source'
        start_date:
          $ref: '#/schemas/start_date'
        updated_at:
          nullable: true
          allOf:
            - $ref: '../common/schemas.yml#/schemas/updated_at'
        value:
          $ref: '#/schemas/value'

  IdentitySupervisionSpace:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      supervision_spaces:
        type: object
        properties:
          id:
            type: integer
            description: The ID of the supervision space
            example: 129
          name:
            type: string
            description: Name of the supervision space
            example: Front Office Users

  email:
    type: string
    description: Email of the identity user
    example: john.smith@gmail.com
    nullable: true

  external_id:
    type: string
    description: An external ID for the identity
    example: it-236
    nullable: true

  id:
    type: integer
    description: The identity ID
    example: 88532

  is_submitter:
    type: boolean
    description: Indicates if the identity did submit data
    example: true

  name:
    type: string
    nullable: true
    description: The identity's name
    example: John Smith

  participant:
    type: boolean
    description: Indicates if this identity was generated from a record (video/audio/text) participant
    example: false

  ai_participant:
    type: boolean
    description: Indicates if the identity is an AI participant
    example: false

  phone_number:
    type: string
    nullable: true
    description: The identity's phone number
    example: 555-867-5309

  risky:
    type: boolean
    description: Indicates if the user has been classified as risky
    example: false

  risk_comment:
    type: string
    description: Comment for the identity's risk in the datum
    example: John is sharing Personal Identifying Information of a client

  risk_risky:
    type: boolean
    description: Indicates if identity is behaving in a risky fashion
    example: true

  risk_datum_id:
    type: integer
    description: The datum ID with the risky behavior in it
    example: 215779
    nullable: true

  IdentityRisks:
    type: object
    properties:
      comment:
        $ref: '#/schemas/risk_comment'
      created_at:
        $ref: '../common/schemas.yml#/schemas/created_at'
      datum_id:
        $ref: '#/schemas/risk_datum_id'
      id:
        type: integer
        example: 138
        description: Identity of the risk
      identity_id:
        type: integer
        example: 66690
        description: The ID of the identity behaving riskily
      risky:
        $ref: '#/schemas/risk_risky'
      updated_at:
        $ref: '../common/schemas.yml#/schemas/updated_at'
      user_id:
        type: integer
        description: The ID of the user that created the risk
        example: 188

  email_end_date:
    type: string
    format: date-time
    description: Email end date timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: null
    nullable: true

  email_start_date:
    type: string
    format: date-time
    description: Email start date timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: '2018-11-28T17:12:12.000Z'
    nullable: true

  external_id_end_date:
    type: string
    format: date-time
    description: External ID end date timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: null
    nullable: true

  external_id_start_date:
    type: string
    format: date-time
    description: External ID start date timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: null
    nullable: true

  phone_number_end_date:
    type: string
    format: date-time
    description: Phone number end date timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: null
    nullable: true

  phone_number_start_date:
    type: string
    format: date-time
    description: Phone number start date timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: null
    nullable: true

  source:
    type: string
    description: The originating source for the identity or attribute
    example: API
    nullable: true

  managed:
    type: boolean
    description: Indicates if the identity is externally managed by the API

  end_date:
    type: string
    format: date-time
    description: End date timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: null
    nullable: true

  field:
    type: string
    description: Extra attribute field name
    example: external_id

  start_date:
    type: string
    format: date-time
    description: Start date timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
    example: '2023-01-14T18:25:27.000Z'
    nullable: true

  value:
    type: string
    description: Extra attribute field value
    example: '88531'
