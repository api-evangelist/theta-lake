paths:
  exports:
    get:
      tags:
        - Exports
      summary: List all export jobs
      description: |
        **REQUIRED PERMISSION:** `exports:read`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: page_token
          in: query
          description: The page token to query next, this comes from the `paging` in the response. This can be either `next_page_token` or `prev_page_token`
          required: false
          schema:
            type: string
        - name: max
          in: query
          description: The max number of items in each page
          required: false
          schema:
            type: integer
            example: 25
            minimum: 1
            maximum: 100
            default: 25
        - name: status
          in: query
          description: If specified, filters the export jobs by status
          required: false
          schema:
            type: array
            items:
              type: string
              example: complete
              enum:
                - complete
                - complete_with_failures
                - failed
                - in_progress
                - stopped
        - name: start
          in: query
          required: false
          description: '**Inclusive** start of the date range using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6). Will default to 7 days before end date if not provided'
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: false
          description: '**Inclusive** end of the date range using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6). Will default to 7 days after `start` or current date if not provided'
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The response contains a paged list of export jobs
          content:
            application/json:
              schema:
                $ref: '#/schemas/GetExportsResponse'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

  exports/destinations:
    get:
      tags:
        - Exports
      summary: List all available export destination integrations
      description: |
        **REQUIRED PERMISSION:** `integrations:read`  
        **RATE LIMIT:** `heavy`
      responses:
        '200':
          description: The response contains a list of export destination integrations
          content:
            application/json:
              schema:
                $ref: '#/schemas/GetExportDestinationsResponse'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

  exports/summary_columns:
    get:
      tags:
        - Exports
      summary: List all available columns for export summary data
      description: |
        **REQUIRED PERMISSION:** `none`  
        **RATE LIMIT:** `heavy`
      responses:
        '200':
          description: The response contains a list of column name and identifiers than can be used when creating an export job
          content:
            application/json:
              schema:
                $ref: '#/schemas/GetExportSummaryColumnsResponse'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

  exports/search/{search_id}:
    post:
      tags:
        - Exports
      summary: Create a new export from a search
      description: |
        **REQUIRED PERMISSION:** `search:export`  
        **RATE LIMIT:** `daily`
      parameters:
        - name: search_id
          in: path
          required: true
          description: The ID of the search to export
          schema:
            type: integer
            example: 72
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/CreateExportSearchRequest'
      responses:
        '202':
          description: The export job was accepted
          content:
            application/json:
              schema:
                $ref: '#/schemas/CreateExportSearchResponse'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '402':
          $ref: '../common/errors.yml#/responses/PaymentRequired'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

schemas:
  CreateExportSearchRequest:
    type: object
    required:
      - container_type
      - data_export_type
      - destination_id
      - folder
    properties:
      analysis_report_options:
        type: object
        description: Options for the analysis report. Applicable when `data_export_type` is `none` or `data_metadata_and_transcript`.
        nullable: true
        properties:
          all_data_report_type:
            type: string
            description: The type of analysis report to export when `data_export_type` is `data_metadata_and_transcript`.
            default: none
            nullable: true
            enum:
              - html
              - none
              - pdf
          no_data_report_type:
            type: string
            description: The type of analysis report to export when `data_export_type` is `none`.
            nullable: true
            enum:
              - pdf
              - pdf_combined
      container_password:
        type: string
        description: The password for the container. Required when `container_type` is `pst` or `zip`.
        nullable: true
        example: my-secure-password
      container_type:
        type: string
        description: The container format for the export.
        enum:
          - none
          - pst
          - zip
      data_export_type:
        type: string
        description: The type of data to include in the export.
        enum:
          - data_only
          - data_and_metadata
          - data_metadata_and_transcript
          - data_metadata_no_image_text
          - none
      destination_id:
        type: integer
        description: The ID of the destination integration (must be a legal hold / archive integration).
        example: 302
      email_format_options:
        type: object
        description: Options for email format exports. Applies when `record_format` is `email`.
        nullable: true
        properties:
          chat_format:
            type: string
            description: The format to use for chat messages in email exports.
            default: theta_lake
            nullable: true
            enum:
              - theta_lake
              - relativity
          deliver_as_report:
            type: boolean
            description: Determines whether the email will include a full or compact report of the compliance record in the email body.
            default: false
      exclude_journal_envelope:
        type: boolean
        description: Whether to exclude the journal envelope from the export.
        default: false
      folder:
        type: string
        description: The name of the folder to export to. Please note, slashes (/) and backslashes (\) will be stripped and ignored (e.g "/some\folder/" becomes "some-folder")
        example: exports_2026
      metadata_csv_options:
        type: object
        description: Options for CSV metadata exports. Applies when `metadata_type` is `csv`.
        nullable: true
        properties:
          column_identifiers:
            type: array
            description: The identifiers of the columns to include. See `exports/summary_columns` for available values.
            example: ["RECORD_ID", "RECORD_TITLE", "RECORD_UUID"]
            items:
              type: string
          column_separator:
            type: string
            description: The character used to separate columns.
            default: ','
            nullable: true
            enum:
              - ','
              - '\t'
              - '|'
              - ';'
              - '~'
              - 'þ'
          multi_value_separator:
            type: string
            description: The character used to separate multiple values within a single column.
            default: ';'
            nullable: true
            enum:
              - ';'
              - '~'
              - 'þ'
              - '#'
              - '\'
          newline_separator:
            type: string
            description: The separator to use for newlines within a value.
            default: "\n"
            nullable: true
            enum:
              - "\n"
              - "\r"
          quote_char:
            type: string
            description: The character used to quote values containing special characters.
            default: '"'
            nullable: true
            enum:
              - '"'
              - "'"
      metadata_type:
        type: string
        description: The format of the metadata to include with the export. Defaults to `json`.
        default: json
        nullable: true
        enum:
          - csv
          - json
          - none
      original_format_options:
        type: object
        description: Options for original format exports. Applies when `record_format` is `original`.
        nullable: true
        properties:
          include_chat_attachments:
            type: boolean
            description: Whether to include chat attachments in the export.
            default: false
      record_format:
        type: string
        description: The format to use when exporting records.
        default: original
        nullable: true
        enum:
          - email
          - original

  CreateExportSearchResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode202'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString202'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      message:
        type: string
        description: The message indicating the result of the operation
        example: Request successfully completed

  GetExportDestinationsResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      export_destinations:
        type: array
        items:
          $ref: '#/schemas/ExportDestination'

  GetExportsResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      paging:
        $ref: '../common/schemas.yml#/schemas/Pagination'
      export_jobs:
        type: array
        items:
          $ref: '#/schemas/Export'

  Export:
    type: object
    properties:
      id:
        type: integer
        description: The ID of the export job
        example: 302
      created_at:
        $ref: '../common/schemas.yml#/schemas/created_at'
      record_count:
        type: integer
        description: The number of records included in this export job
        example: 42
      data_length:
        type: integer
        format: int64
        description: The total size, in bytes, of the exported data
        example: 1048576
      exportable_id:
        type: integer
        description: The ID of the entity being exported
        example: 123
      exportable_type:
        type: string
        description: The type of the entity being exported
        example: Search
        enum:
          - Case
          - Search
      failed_records:
        type: integer
        description: The number of records which failed to export. If `status` is `in_progress` this number may change.
        example: 0
      folder:
        type: string
        description: The destination folder for the exported data
        example: exports-2026
      integration_id:
        type: integer
        description: The ID of the destination integration used for this export
        example: 302
      status:
        type: string
        description: The current status of the export job
        example: complete
        enum:
          - complete
          - complete_with_failures
          - failed
          - in_progress
          - stopped
      url:
        type: string
        description: The URL where the exported data can be retrieved
        example: https://my-export-bucket.s3.amazonaws.com/exports-2026
      user_id:
        type: integer
        description: The ID of the user who initiated the export
        example: 23

  ExportDestination:
    type: object
    properties:
      id:
        type: integer
        description: The ID of the integration
        example: 302
      integration_type:
        type: string
        description: Name of the service integrated with
        example: Zoom
      name:
        type: string
        description: The name of the integration
        example: "Realbank SFTP Archive"

  GetExportSummaryColumnsResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      columns:
        type: array
        items:
          type: object
          properties:
            identifier:
              type: string
              description: The identifier of the column
              example: ALL_ATTACHMENTS_COUNT
            name:
              type: string
              description: The name of the column
              example: All Attachments Count
