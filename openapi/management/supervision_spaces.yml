    delete:
      tags:
        - Supervision Spaces
      summary: Remove users from supervision space
      description: |
        **REQUIRED PERMISSION:** `supervision_spaces:update`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: id
          in: path
          required: true
          description: The supervision space ID
          schema:
