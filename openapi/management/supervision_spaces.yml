  supervision_spaces/{id}/participants:
    post:
      tags:
        - Supervision Spaces
      summary: Add participants to supervision space
      description: |
        **REQUIRED PERMISSION:** `supervision_spaces:update`  
        **RATE LIMIT:** `heavy`  
        **NOTE:**
        This route can be used to add participants to supervision spaces. The `participants_text` is a semi-CSV style list of name, email, or phone number separated by newlines.
        ```
        {
          "participants_text": "johnsmith@example.com\nBob Jones, bob@example.com\nJames K Anderson, james@example.com, 123-333-4567\n"
        }
        ```
        As shown in the example, the syntax is semi-CSV because any of the fields can be omitted.
        Internally the fields are parsed and used to search through known identities. If a match is found, the identity is added to the supervision space. If a match is not found, a new identity is created and added to the supervision space.
      parameters:
        - name: id
          in: path
          required: true
          description: The supervision space ID
          schema:
            type: integer
            example: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participants_text:
                  type: string
                  description: A semi-CSV style list of newline separated name, email, or phone numbers that are associated with an identity
                  example: |
                    johnsmith@example.com
                    Bob Jones, bob@example.com
                    James K Anderson, james@example.com, 123-333-4567
      responses:
        '200':
          description: The supervision space with the added directory groups
          content:
            application/json:
              schema:
                $ref: '#/schemas/GetSupervisionSpaceByIdResponse'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

    delete:
      tags:
        - Supervision Spaces
      summary: Remove participants from supervision space
      description: |
        **REQUIRED PERMISSION:** `supervision_spaces:update`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: id
          in: path
          required: true
          description: The supervision space ID
          schema:
            type: integer
            example: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identity_ids:
                  type: array
                  description: An array of participant's identity IDs to remove from the supervision space
                  items:
                    type: integer
                  example:
                    - 5647
                    - 31973
      responses:
        '200':
          description: The supervision space without the removed participants
          content:
            application/json:
              schema:
                $ref: '#/schemas/GetSupervisionSpaceByIdResponse'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

  supervision_spaces/{id}/identities:
    post:
      tags:
        - Supervision Spaces
      summary: Add identities to supervision space
      description: |
        **REQUIRED PERMISSION:** `supervision_spaces:update`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: id
          in: path
          required: true
          description: The supervision space ID
          schema:
            type: integer
            example: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: An array of identity IDs to associate with this supervision space
              items:
                type: integer
              maxItems: 500
              example:
                - 302
                - 304
                - 305
      responses:
        '200':
          description: The supervision space with the added identities
          content:
            application/json:
              schema:
                $ref: '#/schemas/GetSupervisionSpaceByIdResponse'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

schemas:
  GetSupervisionSpacesResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      paging:
        $ref: '../common/schemas.yml#/schemas/Pagination'
      supervision_spaces:
        type: array
        description: An array of supervision spaces
        items:
          $ref: '#/schemas/SupervisionSpacesSummary'

  GetSupervisionSpacesResponseNew:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      paging:
        $ref: '../common/schemas.yml#/schemas/Pagination'
      supervision_spaces:
        type: array
        description: An array of supervision spaces
        items:
          $ref: '#/schemas/SupervisionSpacesSummaryNew'

  PostPutSupervisionSpacesRequest:
    type: object
    properties:
      all_participants:
        type: boolean
        description: Indicates if the supervision space should allow adding all participants, creating a catch all space for participants. Only one supervision space can have all participants enabled.
        example: false
      all_users:
        type: boolean
        description: Indicates if the supervision space should allow adding all users
        example: false
      name:
        $ref: '#/schemas/name'
      delete_on_expiration:
        $ref: '#/schemas/delete_on_expiration'
      description:
        $ref: '#/schemas/description'
      directory_group_ids:
        type: array
        description: An array of directory group IDs to associate with this supervision space
        items:
          type: integer
        example:
          - 1988
          - 1989
      external_id:
        $ref: '#/schemas/external_id'
      hard_enforce:
        $ref: '#/schemas/hard_enforce'
      integration_ids:
        type: array
        description: An array of integration IDs to associate with this supervision space
        items:
          type: integer
        example:
          - 302
          - 304
          - 305
      media_type_ids:
        type: array
        description: An array of media type IDs to associate with this supervision space,
        items:
          type: integer
        example:
          - 1
          - 2
          - 3
          - 4
          - 5
      retention_library_ids:
        type: array
        description: An array of retention library IDs to associate with this supervision space
        items:
          type: integer
        example:
          - 1
          - 238
      supervision_space_priority:
        $ref: '#/schemas/supervision_space_priority'

  PostSupervisionSpacesResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      supervision_space:
        $ref: '#/schemas/DetailedSupervisionSpace'

  GetSupervisionSpaceByIdResponse:
    type: object
    properties:
      status_code:
        $ref: '../common/schemas.yml#/schemas/StatusCode200'
      status_string:
        $ref: '../common/schemas.yml#/schemas/StatusString200'
      request_id:
        $ref: '../common/schemas.yml#/schemas/RequestId'
      supervision_space:
        $ref: '#/schemas/DetailedSupervisionSpace'

  ### Request/Response above, objects below

  SupervisionSpacesSummary:
    type: object
    properties:
      all_participants:
        $ref: '#/schemas/all_participants'
      all_users:
        $ref: '#/schemas/all_users'
      can_delete:
        $ref: '#/schemas/can_delete'
      can_enable_all_participants:
        $ref: '#/schemas/can_enable_all_participants'
      created_at:
        $ref: '../common/schemas.yml#/schemas/created_at'
      delete_on_expiration:
        $ref: '#/schemas/delete_on_expiration'
      description:
        $ref: '#/schemas/description'
      directory_groups:
        type: array
        description: An array of directory groups
        items:
          type: object
          properties:
            id:
              $ref: 'directory_groups.yml#/schemas/id'
            name:
              $ref: 'directory_groups.yml#/schemas/name'
      disabled:
        $ref: '#/schemas/disabled'
      entry_strategies_count:
        $ref: '#/schemas/entry_strategies_count'
      external_id:
        $ref: '#/schemas/external_id'
      hard_enforce:
        $ref: '#/schemas/hard_enforce'
      id:
        $ref: '#/schemas/id'
      integrations:
        $ref: '#/schemas/integrations'
      media_types:
        $ref: '#/schemas/media_types'
      name:
        $ref: '#/schemas/name'
      participant_count:
        $ref: '#/schemas/participant_count'
      record_count:
        $ref: '#/schemas/record_count'
      retention_libraries:
        $ref: '#/schemas/retention_libraries'
      reviewer_count:
        $ref: '#/schemas/reviewer_count'
      supervision_space_priority:
        $ref: '#/schemas/supervision_space_priority'
      updated_at:
        $ref: '../common/schemas.yml#/schemas/updated_at'

  SupervisionSpacesSummaryNew:
    type: object
    properties:
      all_participants:
        $ref: '#/schemas/all_participants'
