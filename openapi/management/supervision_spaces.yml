paths:
  supervision_spaces:
    get:
      tags:
        - Supervision Spaces
      summary: List all supervision spaces
      description: |
        **REQUIRED PERMISSION:** `supervision_spaces:read`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: page_token
          in: query
          description: The page token to query next, this comes from the `paging` in the response. This can be either `next_page_token` or `prev_page_token`
          required: false
          schema:
            type: string
        - name: max
          in: query
          description: The max number of items in each page
          required: false
          schema:
            type: integer
            example: 25
            minimum: 1
            maximum: 500
            default: 25
      responses:
        '200':
          description: A paged list of supervision spaces
          content:
            application/json:
              schema:
                $ref: '#/schemas/GetSupervisionSpacesResponseNew'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

    post:
      tags:
        - Supervision Spaces
      summary: Create a new supervision space
      description: |
        **REQUIRED PERMISSION:** `supervision_spaces:create`  
        **RATE LIMIT:** `heavy`  
        **NOTE:**
        One input field is `media_type_ids` for the supervision space to handle. The input for this field is an array of integers for the media types. Use the following table to lookup the IDs for each media type.
        | Type           | ID |
        |----------------|----|
        | Video          | 1  |
        | Audio          | 2  |
        | Chat           | 3  |
        | Attachment     | 4  |
        | Email          | 5  |
        | Image          | 6  |
        | AI Interaction | 7  |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/PostPutSupervisionSpacesRequest'
      responses:
        '200':
          description: The new supervision space
          content:
            application/json:
              schema:
                $ref: '#/schemas/PostSupervisionSpacesResponse'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

  supervision_spaces/{id}:
    get:
      tags:
        - Supervision Spaces
      summary: Get supervision space by ID
      description: |
        **REQUIRED PERMISSION:** `supervision_spaces:read`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the supervision space to retrieve
          schema:
            type: integer
            example: 8
      responses:
        '200':
          description: The retrieved supervision space
          content:
            application/json:
              schema:
                $ref: '#/schemas/GetSupervisionSpaceByIdResponse'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

    put:
      tags:
        - Supervision Spaces
      summary: Update supervision space
      description: |
        **REQUIRED PERMISSION:** `supervision_spaces:update`  
        **RATE LIMIT:** `heavy`  
        **NOTE:**
        One input field is `media_type_ids` for the supervision space to handle. The input for this field is an array of integers for the media types. Use the following table to lookup the IDs for each media type.
        | Type           | ID |
        |----------------|----|
        | Video          | 1  |
        | Audio          | 2  |
        | Chat           | 3  |
        | Attachment     | 4  |
        | Email          | 5  |
        | Image          | 6  |
        | AI Interaction | 7  |
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the supervision space to update
          schema:
            type: integer
            example: 8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/PostPutSupervisionSpacesRequest'
      responses:
        '200':
          description: The updated supervision space
          content:
            application/json:
              schema:
                $ref: '#/schemas/GetSupervisionSpaceByIdResponse'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

    delete:
      tags:
        - Supervision Spaces
      summary: Delete supervision space
      description: |
        **REQUIRED PERMISSION:** `supervision_spaces:delete`  
        **RATE LIMIT:** `heavy`
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the supervision space to delete
          schema:
            type: integer
            example: 123
      responses:
        '200':
          description: The deleted supervision space
          content:
            application/json:
              schema:
                $ref: '#/schemas/GetSupervisionSpaceByIdResponse'
        '400':
          $ref: '../common/errors.yml#/responses/BadRequest'
        '401':
          $ref: '../common/errors.yml#/responses/Unauthorized'
        '403':
          $ref: '../common/errors.yml#/responses/Forbidden'
        '404':
          $ref: '../common/errors.yml#/responses/NotFound'
        '429':
          $ref: '../common/errors.yml#/responses/TooManyRequests'
        '500':
          $ref: '../common/errors.yml#/responses/InternalServerError'
        '503':
          $ref: '../common/errors.yml#/responses/ServiceUnavailable'

  supervision_spaces/{id}/users:
    post:
      tags:
