  # Objects above, primitives below

  all_participants:
    type: boolean
    description: Indicates if the supervision space contains all the participants in the org
    example: false

  all_users:
    type: boolean
    description: Indicates if the supervision space contains all the users in the org
    example: false

  retention_libraries:
    type: array
    description: An array of retention libraries associated with this supervision space
    items:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: The retention library ID
        name:
          type: string
          example: Default
          description: The retention library name

  can_delete:
    type: boolean
    description: Indicates if the supervision space can be deleted
    example: false

  can_enable_all_participants:
    type: boolean
    description: Indicates if the supervision space can add all participants. Only one supervision space can have all participants enabled.
    example: false

  description:
    type: string
    description: The description of the supervision space given when created
    example: All central time employees

  disabled:
    type: boolean
    description: Indicates if supervision space is turned on or off
    example: false

  entry_strategies_count:
    type: integer
    description: The count of SWRV rules that include this supervision space
    example: 0

  external_id:
    type: string
    description: An external ID for the supervision space
    example: 'THX-1138'
    nullable: true

  hard_enforce:
    type: boolean
    description: Indicates if users can be assigned records from other supervision spaces
    example: false

  delete_on_expiration:
    type: boolean
    description: Indicates if records are deleted in this supervision space after expiration
    example: false

  id:
    type: integer
    description: The supervision space ID
    example: 12

  integrations:
    type: array
    description: An array of integrations associated with this supervision space
    items:
      type: object
      properties:
        id:
          type: integer
          description: The integration ID
          example: 24
        name:
          type: string
          description: The integration name
          example: Midwest Zoom users

  media_types:
    type: array
    description: An array of media types included in this supervision space
    items:
      type: object
      properties:
        id:
          type: integer
          description: The media type ID
          example: 1
        name:
          type: string
          description: The media types applicable to this supervision space
          example: Video

  name:
    type: string
    description: The supervision space name
    example: Central Time

  participant_count:
    type: integer
    description: The number of participants in the supervision space
    example: 5

  record_count:
    type: integer
    description: The number of records uploaded to this supervision space. This field is deprecated.
    example: 1245

  reviewer_count:
    type: integer
    description: The number of reviewers assigned to the supervision space
    example: 123

  supervision_space_priority:
    type: integer
    description: The priority of assigning records to a supervision space
    example: 3

  participant:
    type: object
    properties:
      email:
        type: string
        nullable: true
        description: The participant's email address
        example: john@smith.com
      identity_id:
        type: integer
        description: The participant's ID
        example: 42
      is_submitter:
        type: boolean
        description: Indicates if the participant did submit data
        example: true
      name:
        type: string
        nullable: true
        description: The participant's name
        example: John Smith
      phone_number:
        type: string
        nullable: true
        description: The participant's phone number
        example: 555-867-5309

  user:
    type: object
    properties:
      current_org_unit:
        type: object
        description: The user's current org unit
        properties:
          archive_only:
            type: boolean
            description: Indicates if this org unit is archive Only
            example: false
          id:
            type: integer
            description: The ID of the current org unit
            example: 1
          name:
            type: string
            description: The name of current org unit
      disabled:
        type: boolean
        description: Indicates if the user is disabled
        example: false
      email:
        type: string
        description: The user's email address
        example: john@smith.com
      last_login:
        type: string
        format: date-time
        nullable: true
        description: The user's last login timestamp using the [RFC3339 date-time format](https://www.rfc-editor.org/rfc/rfc3339#section-5.6)
        example: '2023-01-13T22:50:58.000Z'
      name:
        type: string
        description: The user's name
        example: John Smith
      role:
        type: string
        description: The user's role
        example: Administrator
      role_id:
        type: integer
        description: The ID of the user's role
        example: 3
      user_id:
        type: integer
        description: The user's ID
        example: 422
